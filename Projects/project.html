<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Project detail — Kyle Shakespeare's portfolio.">
  <meta name="author" content="Kyle Shakespeare">
  <title>Kyle Shakespeare | Project</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Same base styles as the rest of the site (one level up), plus detail-page styles -->
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="./project.css">

  <!-- Syntax highlighting (degrades to plain text if the CDN is unreachable) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="project-page">

  <main class="project-detail" id="project-detail">

    <a class="crumb" href="../index.html">&#8249; Back to portfolio</a>

    <!-- Title -->
    <h1 class="project-title" id="project-title">Project</h1>

    <!-- Reason for making / description -->
    <div class="project-desc">
      <span class="desc-label">Reason for making</span>
      <span id="project-desc-body"></span>
    </div>

    <!-- Stage: swaps between the media preview and the IDE -->
    <div class="stage">
      <div class="stage-pane stage-media" id="stage-media"></div>
      <div class="stage-pane stage-ide" id="stage-ide" hidden></div>
    </div>

    <!-- Actions -->
    <div class="project-actions">
      <button type="button" class="pbtn pbtn-primary" id="toggle-source" aria-pressed="false">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0L19.2 12l-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
      </button>
      <a class="pbtn pbtn-ghost" id="back-btn" href="../index.html">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        <span class="label">Back</span>
      </a>
    </div>

  </main>

  <script src="./project.js"></script>
</body>
</html>
